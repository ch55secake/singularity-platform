[package]
name = "singularity-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Private Deadlock match ingestion platform for Singularity"
license = "MIT"

[dependencies]
axum = "0.8"
bzip2 = "0.6"
getrandom = "0.4"
hex = "0.4"
prost = "0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
valveprotos = { git = "https://github.com/deadlock-api/deadlock-api.git", rev = "328a51b6b1857a9092d3dd1e5c79609a2e61202d", features = ["gc-common"] }
zstd = "0.14"
