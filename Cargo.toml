[package]
name = "singularity-platform"
version = "0.1.0"
edition = "2024"
description = "Private Deadlock match ingestion platform for Singularity"
license = "MIT"

[dependencies]
axum = "0.8"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
